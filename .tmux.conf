#set-option -g prefix C-a                                                                                                                                    
#bind-key C-a send-prefix                                                                                                                                    
                                                                                                                                                             
set -g status-position top                                                                                                                                   
set -g mouse on                                                                                                                                              
set -g history-limit 10000                                                                                                                                   
set -g status-right '%Y-%m-%d %H:%M '                                                                                                                        
unbind -T copy-mode MouseDragEnd1Pane                                                                                                                        
                                                                                                                                                             
# Reload config file seamlessly with 'prefix + r'                                                                                                            
unbind r                                                                                                                                                     
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded!"                                                                            
                                                                                                                                                             
# Start window and pane numbering at 1 instead of 0 (matches keyboard layout)                                                                                
set -g base-index 1                                                                                                                                          
set -g pane-base-index 1                                                                                                                                     
set-window-option -g pane-base-index 1                                                                                                                       
set-option -g renumber-windows on                                                                                                                            
                                                                                                                                                             
# For splitting windows                                                                                                                                      
bind | split-window -h                                                                                                                                       
bind - split-window -v                                                                                                                                       
                                                                                                                                                             
# Creating popups                                                                                                                                            
bind-key C-n display-popup -E -w 60% -h 60% "nvim /tmp/scratchpad.md"                                                                                        
bind-key C-t display-popup -E -w 60% -h 60% ""     
